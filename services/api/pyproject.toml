[project]
name = "axiom-api"
version = "0.2.0"
description = "Axiom API and worker runtime foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "SQLAlchemy==2.0.58",
  "psycopg[binary]==3.3.9",
  "PyJWT[crypto]==2.15.1",
  "starlette==1.10.0",
  "pydantic-settings==2.14.2",
  "uvicorn==0.48.0",
]

[dependency-groups]
dev = [
  "alembic==1.20.1",
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pip-audit==2.10.0",
  "pytest==9.0.3",
  "ruff==0.14.14",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: isolated real PostgreSQL integration tests"]
 
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

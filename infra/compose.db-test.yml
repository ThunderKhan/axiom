# Explicitly opt-in disposable PostgreSQL only; not part of app deployment Compose.
name: axiom-pg-test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: axiom_test
      POSTGRES_USER: postgres
      # Trust is confined to loopback test container; NEVER enable for shared/hosted DBs.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../services/api/tests/postgres_roles.sql:/docker-entrypoint-initdb.d/010-roles.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axiom_test"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: "no"

name: "Bug report"
description: "Report a reproducible defect or regression in Axiom"
title: "[Bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please include enough evidence to reproduce this issue. Never post
        API keys, access tokens, customer data or security exploit details.
        For security vulnerabilities use GitHub's private
        [Report a vulnerability](https://github.com/ThunderKhan/axiom/security/advisories/new)
        form, not this public issue form. If that private form is unavailable,
        do not disclose details publicly; follow
        [SECURITY.md](https://github.com/ThunderKhan/axiom/blob/main/SECURITY.md).
  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
      description: What happens? Include the exact visible error where safe.
      placeholder: "Observed failure..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen? Link the relevant requirement or user flow if known.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide numbered steps with test data (not credentials).
      placeholder: "1. Open ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component
      options:
        - Frontend and design
        - API and backend
        - Authentication or permissions
        - Database and migrations
        - AI and evidence analysis
        - Data source integration
        - MCP and external clients
        - CI and infrastructure
        - Unknown or other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
      description: Browser, OS, commit SHA, staging/local, relevant versions.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots and regression test idea
      description: Redact secrets and personal data; state any failure-mode or regression test.
    validations:
      required: false

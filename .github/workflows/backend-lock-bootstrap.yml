name: Backend dependency lock bootstrap (temporary)
on:
  push:
    branches: [feat/9-fastapi-worker-docker-foundation]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve and verify exact Python dependencies
        working-directory: services/api
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.0
          uv lock --python 3.12
          uv sync --locked --all-groups
          echo AXIOM_UV_LOCK_BEGIN
          cat uv.lock
          echo AXIOM_UV_LOCK_END
      - name: Inspect Python OCI base digest
        run: |
          docker buildx imagetools inspect python:3.12.12-slim-bookworm | head -n 18
      - name: Set up Node for existing frontend quality gates
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Repository check prerequisites
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 markdown-it-py==4.0.0
      - name: Repository integrity and CI negative self-tests
        run: |
          python ci/quality_gate.py self-test
          python ci/quality_gate.py repository
      - name: Canonical Ruff formatting for review (temporary)
        working-directory: services/api
        run: |
          uv run --frozen ruff format app scripts tests
          for file in app/api.py app/main.py app/settings.py app/worker.py scripts/check_style.py; do
            echo "AXIOM_FORMAT_BEGIN:$file"
            cat "$file"
            echo "AXIOM_FORMAT_END:$file"
          done
      - name: Full application quality gates
        run: python ci/quality_gate.py application
      - name: Real Docker/Compose/worker smoke and negative inputs
        run: python ci/docker_smoke.py

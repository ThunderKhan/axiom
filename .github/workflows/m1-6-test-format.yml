name: Temporary M1.6 test formatter
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  formatting-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Emit pinned-Prettier formatted tests
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const files = [
            "src/lib/workspace-api.test.ts",
            "src/lib/workspace-context.test.ts",
          ];
          execFileSync("node", ["node_modules/prettier/bin/prettier.cjs", "--write", ...files], { stdio: "inherit" });
          const data = files.map(path => ({path:"apps/web/" + path, content:fs.readFileSync(path,"utf8")}));
          const encoded = Buffer.from(JSON.stringify(data), "utf8").toString("base64");
          for (let i = 0; i < encoded.length; i += 3000) console.log("AXIOM_FORMAT_CHUNK:" + encoded.slice(i, i + 3000));
          NODE

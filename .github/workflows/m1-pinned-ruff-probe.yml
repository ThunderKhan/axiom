name: Temporary M1 verified Ruff formatter
on:
  push:
    branches: [feat/16-workspace-persistence-rls]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Apply pinned Ruff on isolated runner and export exact file bytes as hex
        run: |
          cd services/api
          uv sync --locked --all-groups
          uv run --frozen ruff check --select I --fix app/database.py scripts/run_db_integration.py tests/test_database_integration.py tests/test_db_runner_guard.py
          uv run --frozen ruff format app/database.py scripts/run_db_integration.py tests/test_database_integration.py tests/test_db_runner_guard.py
          python - <<'PY'
          from pathlib import Path
          for filename in ('app/database.py', 'scripts/run_db_integration.py', 'tests/test_database_integration.py', 'tests/test_db_runner_guard.py'):
              print('M1HX_BEGIN:' + filename)
              body = Path(filename).read_bytes().hex()
              for offset in range(0, len(body), 192):
                  print('M1HX_LINE:' + body[offset:offset+192])
              print('M1HX_END:' + filename)
          PY

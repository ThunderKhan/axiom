name: Temporary dependency and format capture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (without persisted credentials)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Generate reproducible lock and Prettier-canonical files
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run format
          for name in package-lock.json src/app/layout.tsx src/app/page.tsx src/lib/foundation.ts tests/foundation.smoke.spec.ts tsconfig.json; do
            echo "__AXIOM_FILE_BEGIN__:$name"
            base64 -w0 "$name"
            echo
            echo "__AXIOM_FILE_END__:$name"
          done

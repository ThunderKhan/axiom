name: Temporary profile formatter export
on:
  pull_request:
    paths:
      - ".github/workflows/format-profile-review.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply pinned Prettier in ephemeral checkout
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --write src/lib/profile-api.ts src/lib/profile-questions.ts src/lib/profile-questions.test.ts src/app/app/profile-wizard.tsx
      - name: Apply pinned Ruff in ephemeral checkout
        working-directory: services/api
        run: |
          python -m pip install uv==0.10.0
          uv sync --frozen
          uv run --frozen ruff format app/profile_contract.py app/profile_http.py app/profile_store.py app/models.py migrations/versions/m2_0001_profiles.py tests/test_profile_contract.py tests/test_profile_integration.py
          uv run --frozen ruff check --fix app/profile_contract.py app/profile_http.py app/profile_store.py app/models.py migrations/versions/m2_0001_profiles.py tests/test_profile_contract.py tests/test_profile_integration.py
      - name: Export formatted project source only
        run: |
          for file in \
            apps/web/src/lib/profile-api.ts \
            apps/web/src/lib/profile-questions.ts \
            apps/web/src/lib/profile-questions.test.ts \
            apps/web/src/app/app/profile-wizard.tsx \
            services/api/app/profile_contract.py \
            services/api/app/profile_http.py \
            services/api/app/profile_store.py \
            services/api/app/models.py \
            services/api/migrations/versions/m2_0001_profiles.py \
            services/api/tests/test_profile_contract.py \
            services/api/tests/test_profile_integration.py; do
            echo "AXIOM_PROFILE_BEGIN:$file"
            base64 -w0 "$file"
            echo ""
            echo "AXIOM_PROFILE_END:$file"
          done

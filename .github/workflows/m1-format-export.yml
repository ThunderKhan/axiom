name: Temporary M1 Python format export
on:
  push:
    branches: [feat/16-workspace-persistence-rls]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Format source in temporary runner and export exact textual lines
        run: |
          cd services/api
          uv sync --locked --all-groups
          uv run --frozen ruff check --select I --fix app migrations tests scripts
          uv run --frozen ruff format app migrations tests scripts
          python - <<'PY'
          import json
          from pathlib import Path
          for directory in ('app', 'migrations', 'tests', 'scripts'):
              for file in sorted(Path(directory).rglob('*.py')):
                  print('M1_FMT_BEGIN|' + str(file))
                  for line in file.read_text(encoding='utf-8').splitlines():
                      print('M1_FMT_LINE|' + json.dumps(line, ensure_ascii=True))
                  print('M1_FMT_END|' + str(file))
          PY

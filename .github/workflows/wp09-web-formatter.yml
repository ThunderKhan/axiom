# Temporary no-write-back Prettier export for review fixes; delete before merge.
name: Temporary WP09 review-fix Prettier export
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/wp09-web-formatter.yml"
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install pinned web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Format and check changed TSX/TypeScript in disposable runner
        working-directory: apps/web
        run: |
          npm exec -- prettier --write src/lib/lead-contract.ts src/lib/lead-contract.test.ts src/app/app/lead-manager.tsx
          npm exec -- prettier --check src/lib/lead-contract.ts src/lib/lead-contract.test.ts src/app/app/lead-manager.tsx
      - name: Export exact formatted bytes to job log
        run: |
          for file in \
            apps/web/src/lib/lead-contract.ts \
            apps/web/src/lib/lead-contract.test.ts \
            apps/web/src/app/app/lead-manager.tsx; do
            echo "AXIOM_REVIEW_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo ""
            echo "AXIOM_REVIEW_FORMAT_END:$file"
          done

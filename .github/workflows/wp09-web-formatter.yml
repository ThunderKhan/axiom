# Temporary, read-only formatter export; delete before PR merge.
name: Temporary WP09 web Prettier export
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/wp09-web-formatter.yml"
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install exact pinned web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Prettier in disposable runner
        working-directory: apps/web
        run: |
          npm exec -- prettier --write src/lib/lead-contract.ts src/lib/lead-api.ts src/lib/lead-contract.test.ts src/lib/lead-api.test.ts src/app/app/lead-manager.tsx src/app/app/workspace-manager.tsx src/app/globals.css scripts/run-unit-tests.mjs tests/workspace.smoke.spec.ts
          npm exec -- prettier --check src/lib/lead-contract.ts src/lib/lead-api.ts src/lib/lead-contract.test.ts src/lib/lead-api.test.ts src/app/app/lead-manager.tsx src/app/app/workspace-manager.tsx src/app/globals.css scripts/run-unit-tests.mjs tests/workspace.smoke.spec.ts
      - name: Export exact formatted file bytes for review
        run: |
          for file in \
            apps/web/src/lib/lead-contract.ts \
            apps/web/src/lib/lead-api.ts \
            apps/web/src/lib/lead-contract.test.ts \
            apps/web/src/lib/lead-api.test.ts \
            apps/web/src/app/app/lead-manager.tsx \
            apps/web/src/app/app/workspace-manager.tsx \
            apps/web/src/app/globals.css \
            apps/web/scripts/run-unit-tests.mjs \
            apps/web/tests/workspace.smoke.spec.ts; do
            echo "AXIOM_WEB_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo ""
            echo "AXIOM_WEB_FORMAT_END:$file"
          done

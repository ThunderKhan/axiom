name: Temporary profile single-file formatting
on:
  pull_request:
    paths:
      - ".github/workflows/format-one-profile.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Print pinned Prettier output from ephemeral checkout
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --write src/app/app/profile-wizard.tsx
          echo AXIOM_ONE_BEGIN
          base64 -w0 src/app/app/profile-wizard.tsx
          echo
          echo AXIOM_ONE_END

name: Auth formatter transfer (temporary, unmerged)

on:
  push:
    branches:
      - feat/15-supabase-jwt-principal

permissions:
  contents: read

jobs:
  format-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Apply locked formatter and export focused files for review
        run: |
          cd services/api
          uv sync --locked --all-groups
          uv run --frozen ruff format app/auth.py app/settings.py app/main.py tests/test_auth.py
          uv run --frozen ruff check --fix app/auth.py app/settings.py app/main.py tests/test_auth.py
          uv run --frozen ruff format app/auth.py app/settings.py app/main.py tests/test_auth.py
          uv run --frozen ruff check app/auth.py app/settings.py app/main.py tests/test_auth.py
          python - <<'PY'
          from pathlib import Path
          import base64
          for path in ("app/auth.py", "app/settings.py", "app/main.py", "tests/test_auth.py"):
              print("AXIOM_FORMAT_BEGIN_" + path)
              print(base64.b64encode(Path(path).read_bytes()).decode())
              print("AXIOM_FORMAT_END_" + path)
          PY

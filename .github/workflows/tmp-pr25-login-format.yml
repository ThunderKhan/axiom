name: Temporary login regression formatting
on:
  push:
    branches: [feat/17-supabase-web-auth]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Format and print exact regression test bytes
        run: |
          cd apps/web
          npm exec -- prettier --write tests/auth.smoke.spec.ts
          npm exec -- prettier --check src/app/login/login-form.tsx tests/auth.smoke.spec.ts
          python - <<'PY'
          from pathlib import Path
          body = Path("tests/auth.smoke.spec.ts").read_bytes().hex()
          print("AXFMT_START")
          for offset in range(0, len(body), 256):
              print("AXFMT_HEX:" + body[offset:offset + 256])
          print("AXFMT_END")
          PY

name: Temporary dependency lockfile bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (without persisted credentials)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Resolve public npm dependencies to a committed lockfile
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "__AXIOM_LOCK_BEGIN__"
          base64 -w0 package-lock.json
          echo
          echo "__AXIOM_LOCK_END__"

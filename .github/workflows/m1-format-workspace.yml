name: Temporary M1 workspace-format verification
on:
  push:
    branches: [feat/16-workspace-persistence-rls]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Format two checked files on runner and export content
        run: |
          cd services/api
          uv sync --locked --all-groups
          uv run --frozen ruff check --fix app/workspace_store.py tests/test_database_integration.py
          uv run --frozen ruff format app/workspace_store.py tests/test_database_integration.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ('app/workspace_store.py', 'tests/test_database_integration.py'):
              print('M1_FW_BEGIN:' + path)
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  print('M1_FW_LINE:' + json.dumps(line, ensure_ascii=True))
              print('M1_FW_END:' + path)
          PY

name: Auth lockfile bootstrap (temporary, unmerged)

on:
  push:
    branches:
      - feat/15-supabase-jwt-principal

permissions:
  contents: read

jobs:
  generate-lock:
    name: Generate reviewed uv dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned dependency manager
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Resolve and print lockfile for reviewed branch
        run: |
          cd services/api
          uv lock
          python - <<'PY'
          import base64
          from pathlib import Path
          print("AXIOM_LOCK_BEGIN")
          print(base64.b64encode(Path("uv.lock").read_bytes()).decode())
          print("AXIOM_LOCK_END")
          PY

name: Temporary PR25 review formatting verification
on:
  push:
    branches: [feat/17-supabase-web-auth]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Install from locked npm manifest
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Format changed frontend files with pinned Prettier and emit patch bytes
        run: |
          cd apps/web
          npm exec -- prettier --write README.md playwright.config.ts playwright.provider.config.ts src/app/app/auth-observer.tsx src/app/app/sign-out-button.tsx src/app/login/login-form.tsx src/app/login/page.tsx src/lib/private-state.ts src/lib/private-state.test.ts src/lib/auth-sync.ts src/lib/auth-sync.test.ts src/lib/supabase/cookie-policy.ts src/lib/supabase/cookie-policy.test.ts src/lib/supabase/browser.ts src/lib/supabase/server.ts src/lib/supabase/proxy.ts tests/auth-provider.smoke.spec.ts tests/auth.smoke.spec.ts scripts/run-unit-tests.mjs
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output(['git', '-C', '../..', 'diff', '--name-only', '--', 'apps/web'], text=True).splitlines()
          print('AXFMT_COUNT:' + str(len(paths)))
          for path in paths:
              content = Path('../..', path).read_bytes().hex()
              print('AXFMT_BEGIN:' + path)
              for offset in range(0, len(content), 256):
                  print('AXFMT_HEX:' + content[offset:offset+256])
              print('AXFMT_END:' + path)
          PY
      - name: Typecheck, unit suite, production build and deterministic smoke
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run build
          npx playwright install chromium
          npm run test:smoke

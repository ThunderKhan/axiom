name: Temporary M1.5 backend verification and formatting
on:
  push:
    branches: [feat/18-workspace-api]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axiom_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axiom_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.10.0
      - name: Resolve locked environment
        working-directory: services/api
        run: uv sync --locked --all-groups
      - name: Apply pinned Ruff formatter to changed Python only, export diff
        working-directory: services/api
        run: |
          uv run --frozen ruff check --fix app/workspace_cursor.py app/workspace_http.py app/workspace_store.py app/main.py tests/test_workspace_cursor.py tests/test_workspace_http.py tests/test_workspace_api_integration.py tests/test_api.py scripts/run_db_integration.py
          uv run --frozen ruff format app/workspace_cursor.py app/workspace_http.py app/workspace_store.py app/main.py tests/test_workspace_cursor.py tests/test_workspace_http.py tests/test_workspace_api_integration.py tests/test_api.py scripts/run_db_integration.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output(['git', '-C', '../..', 'diff', '--name-only', '--', 'services/api'], text=True).splitlines()
          print('AXM15_COUNT:' + str(len(paths)))
          for path in paths:
              body = Path('../..',path).read_bytes().hex()
              print('AXM15_BEGIN:' + path)
              for offset in range(0, len(body), 256):
                  print('AXM15_HEX:' + body[offset:offset+256])
              print('AXM15_END:' + path)
          PY
      - name: Lint, typecheck, unit, and real isolated PostgreSQL integration
        working-directory: services/api
        env:
          AXIOM_TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/axiom_test
          AXIOM_MIGRATION_DATABASE_URL: postgresql://axiom_migrator@127.0.0.1:55432/axiom_test
          AXIOM_TEST_RUNTIME_DATABASE_URL: postgresql://axiom_runtime@127.0.0.1:55432/axiom_test
        run: |
          uv run --frozen ruff check .
          uv run --frozen mypy app
          uv run --frozen pytest -q --junitxml=test-results/junit.xml
          uv run --frozen python scripts/run_db_integration.py

# Temporary read-only formatter export for WP-03; remove before merge.
name: Temporary WP03 formatter export
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/**"
      - ".github/workflows/format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format web in isolated job copy
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prettier --write src/app/app/profile-wizard.tsx src/app/app/workspace-manager.tsx src/app/globals.css src/lib/profile-api.ts src/lib/profile-questions.ts
      - name: Format Python in isolated job copy
        working-directory: services/api
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.0
          uv sync --frozen
          uv run --frozen ruff check --fix app/main.py app/models.py app/profile_contract.py app/profile_http.py app/profile_store.py migrations/versions/m2_0001_profiles.py tests/test_profile_contract.py tests/test_profile_integration.py
          uv run --frozen ruff format app/main.py app/models.py app/profile_contract.py app/profile_http.py app/profile_store.py migrations/versions/m2_0001_profiles.py tests/test_profile_contract.py tests/test_profile_integration.py
      - name: Export reproducible formatting in public logs
        run: |
          for file in \
            apps/web/src/app/app/profile-wizard.tsx \
            apps/web/src/app/app/workspace-manager.tsx \
            apps/web/src/app/globals.css \
            apps/web/src/lib/profile-api.ts \
            apps/web/src/lib/profile-questions.ts \
            services/api/app/main.py \
            services/api/app/models.py \
            services/api/app/profile_contract.py \
            services/api/app/profile_http.py \
            services/api/app/profile_store.py \
            services/api/migrations/versions/m2_0001_profiles.py \
            services/api/tests/test_profile_contract.py \
            services/api/tests/test_profile_integration.py; do
            echo "AXIOM_FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo ""
            echo "AXIOM_FORMAT_END:$file"
          done

name: Temporary evidence formatter verification
on:
  pull_request:
    paths:
      - ".github/workflows/format-evidence-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact repository-pinned formatter in ephemeral checkout
        working-directory: services/api
        run: |
          python -m pip install uv==0.10.0
          uv sync --frozen
          uv run --frozen ruff format --diff app/evidence_engine.py tests/test_evidence_engine.py
          uv run --frozen ruff format app/evidence_engine.py tests/test_evidence_engine.py
          echo AXIOM_EVIDENCE_FORMAT_BEGIN
          base64 -w0 app/evidence_engine.py
          echo
          echo AXIOM_EVIDENCE_FORMAT_END

name: Temporary evidence formatter export
on:
  pull_request:
    paths:
      - ".github/workflows/format-evidence-preview.yml"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply locked Ruff in ephemeral checkout
        working-directory: services/api
        run: |
          python -m pip install uv==0.10.0
          uv sync --frozen
          uv run --frozen ruff format app/evidence_engine.py tests/test_evidence_engine.py
          uv run --frozen ruff check --fix app/evidence_engine.py tests/test_evidence_engine.py
      - name: Print bounded formatted source
        run: |
          for file in services/api/app/evidence_engine.py services/api/tests/test_evidence_engine.py; do
            echo "AXIOM_EVIDENCE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "AXIOM_EVIDENCE_END:$file"
          done

name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Quality / repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (without persisted credentials)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install workflow syntax validator
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'markdown-it-py==4.0.0'
      - name: Test CI policy helpers (fail on zero discovered tests)
        run: python ci/quality_gate.py self-test
      - name: Check M1 provider gate rejects missing and forged evidence
        run: python ci/m1_acceptance.py self-test
      - name: Check documentation, workflow policy, and obvious secrets
        run: python ci/quality_gate.py repository

  application:
    name: Quality / application readiness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axiom_test
          # Ephemeral isolated runner ONLY; never use trust for a hosted database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axiom_test"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout (without persisted credentials)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Node.js 22 (available for future frontend checks)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked Python package manager
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Execute required application checks when code is present
        run: python ci/quality_gate.py application
      - name: Mandatory real PostgreSQL migration and RLS isolation gate
        working-directory: services/api
        env:
          AXIOM_TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/axiom_test
          AXIOM_MIGRATION_DATABASE_URL: postgresql://axiom_migrator@127.0.0.1:55432/axiom_test
          AXIOM_TEST_RUNTIME_DATABASE_URL: postgresql://axiom_runtime@127.0.0.1:55432/axiom_test
        run: uv run --frozen python scripts/run_db_integration.py
      # Temporary, non-secret diagnostic for issue #29: identify checkout
      # mutations after installs and isolated DB tests. Never print untracked
      # paths; they may contain private names even in otherwise public CI.
      - name: Diagnose provider checkout integrity without provider credentials
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import PurePath
          import subprocess
          output = subprocess.run(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all",
               "--ignore-submodules=none"],
              check=True, capture_output=True,
          ).stdout
          records = [x for x in output.split(b"\0") if x]
          print(f"M1_DIAGNOSTIC status_records={len(records)}")
          for record in records:
              if len(record) < 4:
                  raise SystemExit("M1_DIAGNOSTIC malformed git status")
              status = record[:2].decode("ascii", errors="replace")
              path = record[3:]
              if status == "??":
                  name = PurePath(os.fsdecode(path)).suffix.lower()
                  digest = hashlib.sha256(path).hexdigest()[:12]
                  print(f"M1_DIAGNOSTIC untracked suffix={name!r} path_sha256_12={digest}")
              else:
                  # Tracked paths are already public repository metadata.
                  tracked = os.fsdecode(path).encode("unicode_escape").decode("ascii")[:200]
                  print(f"M1_DIAGNOSTIC tracked status={status!r} path={tracked!r}")
          PY
      - name: Mandatory Docker build, Compose and API/worker smoke
        run: python ci/docker_smoke.py
      - name: Mandatory M0 real web, browser, API and worker integration smoke
        run: python ci/integrated_smoke.py

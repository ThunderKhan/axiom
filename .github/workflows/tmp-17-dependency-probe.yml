name: Temporary M1.4 dependency lock probe
on:
  push:
    branches: [feat/17-supabase-web-auth]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Resolve reviewed Supabase SSR and SDK versions without modifying repository
        run: |
          cd apps/web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact @supabase/ssr@0.12.7 @supabase/supabase-js@2.119.1
          node -e "let p=require('./package.json'); if(p.dependencies['@supabase/ssr']!=='0.12.7'||p.dependencies['@supabase/supabase-js']!=='2.119.1') process.exit(1)"
          python - <<'PY'
          from pathlib import Path
          for filename in ('package.json', 'package-lock.json'):
              body = Path(filename).read_bytes().hex()
              print('AX17_BEGIN:' + filename)
              for offset in range(0, len(body), 256):
                  print('AX17_HEX:' + body[offset:offset+256])
              print('AX17_END:' + filename)
          PY

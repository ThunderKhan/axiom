version = 1

[packages.web]
directory = "apps/web"
manifest = "package.json"
lockfile = "package-lock.json"
test_files = ["src/**/*.test.ts", "tests/**/*.smoke.spec.ts"]
test_report = "test-results/junit.xml"
install = ["npm", "ci", "--no-audit", "--no-fund"]
lint = ["npm", "run", "check:style"]
typecheck = ["npm", "run", "typecheck"]
test = ["npm", "run", "test:ci"]
build = ["npm", "run", "build"]
security = ["npm", "run", "audit"]

[packages.api]
directory = "services/api"
manifest = "pyproject.toml"
lockfile = "uv.lock"
test_files = ["tests/test_*.py"]
test_report = "test-results/junit.xml"
install = ["uv", "sync", "--locked", "--all-groups"]
lint = ["uv", "run", "--frozen", "python", "scripts/check_style.py"]
typecheck = ["uv", "run", "--frozen", "mypy", "app"]
test = ["uv", "run", "--frozen", "pytest", "-q", "--junitxml=test-results/junit.xml"]
build = ["uv", "build", "--wheel", "--out-dir", "dist"]
security = ["uv", "run", "--frozen", "pip-audit", "--progress-spinner", "off"]
